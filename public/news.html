<body data-page="news">
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/">
      <span class="brand-mark" data-setting-initial>星</span>
      <span class="brand-text" data-setting="site_name">星辰智造科技有限公司</span>

    <button class="nav-toggle" type="button" aria-label="展开导航">☰</button>

    </nav>
  </div>
</header>

<main>
  <section class="section" style="background:#fff;border-bottom:1px solid var(--line);padding-bottom:36px">
    <div class="container">
      <span class="eyebrow">News Center</span>
      <h1>新闻中心</h1>
      <p class="lead">公司动态、行业观察与技术实践。</p>

  </section>

  <section class="section">
    <div class="container">
      <div class="toolbar">
        <div data-category-chips style="display:flex;gap:8px;flex-wrap:wrap"></div>
        <div class="spacer"></div>
        <form class="search-box" data-search-form>
          <input type="search" name="q" placeholder="搜索文章标题或内容…" aria-label="搜索文章">
          <button class="btn btn-primary" type="submit">搜索</button>
        </form>
      </div>

      <div class="news-list" data-news-list>
        <div class="card">正在加载文章…</div>
      </div>
      <div class="pagination" data-pagination></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <h4 data-setting="site_name">星辰智造科技有限公司</h4>

    <div>

    <span class="footer-licenses">
      <span data-setting="icp">粤ICP备00000000号-1</span>
      <span data-setting="police">粤公网安备 44030000000000号</span>
    </span>
