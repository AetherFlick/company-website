#:schema node_modules/wrangler/config-schema.json
# ============================================================
# Cloudflare Pages + D1 配置
# 使用步骤：
#   1) npx wrangler d1 create company-site-db   （记下返回的 database_id）
#   2) 把下面的 database_id 替换为真实值
#   3) 在 GitHub 仓库 → Cloudflare Pages 中连接本仓库，构建输出目录 public
# ============================================================

name = "company-site"
compatibility_date = "2024-11-06"
pages_build_output_dir = "public"

# D1 数据库绑定：代码中通过 env.DB 访问
[[d1_databases]]
binding = "DB"
database_name = "company-site-db"
database_id = "PASTE_YOUR_D1_DATABASE_ID_HERE"
migrations_dir = "migrations"

# 非敏感环境变量（敏感值请用 wrangler pages secret put 或 Pages 控制台设置）
[vars]
ENVIRONMENT = "production"
SITE_URL = "https://your-domain.example.com"

# 预览环境（可选）：可以为 preview 分支单独指定数据库
# [env.preview.vars]
# ENVIRONMENT = "preview"
